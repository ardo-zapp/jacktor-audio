[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^7.0.0
board = esp32-s3-devkitc-1
framework = espidf

; FLASH 16MB & PSRAM 8MB OPI configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.f_psram = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; Dual-slot OTA partition configuration (Jacktor custom partition)
board_build.partitions = ../partitions/jacktor_panel_ota.csv

upload_speed = 921600
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags =
  -D BOARD_HAS_PSRAM
  ; TFT_eSPI setup configuration via build flags
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_CS=10
  -D TFT_RST=8
  -D TFT_DC=9
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_MISO=13
  -D TFT_BL=38 ; Use GPIO 38 for backlight PWM control
  -D TOUCH_CS=15
  -D SPI_FREQUENCY=80000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  ; Configure LVGL to read lv_conf.h from project include directory
  -D LV_CONF_INCLUDE_SIMPLE=1
  -D LV_CONF_PATH="${PROJECT_DIR}/include/lv_conf.h"
  -D LV_LVGL_H_INCLUDE_SIMPLE=1
  -D MICRO_FLAC_MEMORY_PREFER_PSRAM

lib_ldf_mode = chain+
lib_compat_mode = strict

lib_deps =
