[env:esp32dev]
platform = espressif32 @ ^7.0.0
board = esp32dev
framework = espidf

upload_speed = 921600
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

; Single-slot Factory partition configuration (No OTA)
board_build.partitions = ../partitions/jacktor_audio_factory.csv

build_flags =
  -std=gnu++17
  -Wall
  -Werror

lib_ldf_mode = chain+
lib_compat_mode = strict

lib_deps =
